<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenotype Predictor & Mixer Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>

    <style>
        :root { --bg: #0a0a0a; --card: #151515; --text: #eee; --accent: #ffff00; }
        body { font-family: 'Inter', Courier, monospace; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header { width: 100%; max-width: 900px; text-align: center; margin-bottom: 20px; }
        h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-size: 20px; }

        .app-container { display: flex; flex-wrap: wrap; gap: 20px; width: 100%; max-width: 900px; justify-content: center; }
        
        .panel { background: var(--card); padding: 20px; border-radius: 10px; flex: 1; min-width: 300px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .panel h2 { font-size: 14px; color: #888; margin-top: 0; text-transform: uppercase; }
        
        .image-box { width: 300px; height: 400px; background: #000; border: 1px solid #444; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }
        .image-box img, .image-box canvas { width: 100%; height: 100%; object-fit: cover; }
        
        .controls { margin-top: 15px; width: 100%; text-align: center; }
        input[type="file"] { display: none; }
        .btn { background: var(--accent); color: #000; padding: 10px 20px; border: none; border-radius: 5px; font-weight: 800; cursor: pointer; text-transform: uppercase; display: inline-block; font-size: 12px; }
        .btn:hover { opacity: 0.8; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .terminal { width: 100%; max-width: 860px; background: #050505; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px solid #333; font-size: 13px; line-height: 1.5; color: #00ff00; height: 200px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>

<header>
    <h1>Phenotype Predictor AI</h1>
</header>

<div class="app-container">
    <div class="panel">
        <h2>Target Face</h2>
        <div class="image-box">
            <img id="inputImage" src="" style="display:none;" alt="Uploaded Face">
            <span id="placeholderText" style="color: #444; font-size: 12px;">NO IMAGE SELECTED</span>
        </div>
        <div class="controls">
            <label for="uploadBtn" class="btn">Upload Image</label>
            <input type="file" id="uploadBtn" accept="image/*">
        </div>
    </div>

    <div class="panel">
        <h2>AI Structural Mix</h2>
        <div class="image-box">
            <canvas id="resultCanvas" width="600" height="750"></canvas>
        </div>
        <div class="controls">
            <button id="analyzeBtn" class="btn" disabled>Booting AI...</button>
        </div>
    </div>
</div>

<div class="terminal" id="terminal">
    === SYSTEM STATUS ===<br>
    Fetching neural networks...<br>
</div>

<script>
    let phenotypeList = [];
    
    const inputImage = document.getElementById('inputImage');
    const uploadBtn = document.getElementById('uploadBtn');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultCanvas = document.getElementById('resultCanvas');
    const ctx = resultCanvas.getContext('2d');
    const terminal = document.getElementById('terminal');

    // --- ROBUST MATH HELPERS ---
    const dot = (a, b) => a.reduce((acc, n, i) => acc + n * b[i], 0);
    const cosSimilarity = (a, b) => {
        const d = dot(a, b) / (Math.sqrt(dot(a, a)) * Math.sqrt(dot(b, b)));
        return d;
    };

    const hexToF32Arr = (str) => {
        if (!str || typeof str !== 'string') return new Float32Array(128);
        let clean = str.replace(/[^A-Za-z0-9+/=]/g, ""); // Remove any junk
        while (clean.length % 4 !== 0) clean += "="; // Fix padding
        try {
            const binary = atob(clean);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Float32Array(bytes.buffer);
        } catch (e) {
            console.error("Base64 Decode Error", e);
            return new Float32Array(128);
        }
    };

    const processEntry = (arr) => [
        arr[0], // Name
        arr[1] ? hexToF32Arr(arr[1]) : new Float32Array(128), // Male Desc
        arr[2] ? hexToF32Arr(arr[2]) : new Float32Array(128)  // Female Desc
    ];

    // --- INITIALIZATION ---
    async function initSystem() {
        try {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL)
            ]);
            
            logTerminal("Neural networks loaded.");
            logTerminal("Downloading phenotype dataset...");

            const response = await fetch('list.json');
            const rawList = await response.json();

            // Transform descriptors once during boot
            phenotypeList = rawList.map(group => {
                let processedGroup = [];
                // Group[0] is the main phenotype
                processedGroup.push(processEntry(group[0]));
                // The last item in group is the sub-phenotype array
                let subs = group[group.length - 1].map(s => processEntry(s));
                processedGroup.push(subs);
                return processedGroup;
            });

            logTerminal("Dataset ready. Awaiting user input.");
            analyzeBtn.innerText = "ANALYZE & MIX";
        } catch (err) {
            logTerminal(`CRITICAL ERROR: ${err.message}`, true);
        }
    }

    // --- FILE UPLOAD ---
    uploadBtn.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                inputImage.src = event.target.result;
                inputImage.style.display = 'block';
                document.getElementById('placeholderText').style.display = 'none';
                analyzeBtn.disabled = false;
                logTerminal(`Image loaded: ${file.name}`);
            }
            reader.readAsDataURL(file);
        }
    });

    // --- MAIN ANALYSIS ---
    analyzeBtn.addEventListener('click', async () => {
        if (!inputImage.src) return;
        
        try {
            analyzeBtn.disabled = true;
            logTerminal("Extracting descriptors...");

            const detection = await faceapi.detectSingleFace(inputImage)
                .withFaceLandmarks().withAgeAndGender().withFaceDescriptor();

            if (!detection) {
                logTerminal("Face not detected. Check lighting.", true);
                analyzeBtn.disabled = false;
                return;
            }

            const genderShort = (detection.gender === 'female') ? 'f' : 'm';
            const gIdx = genderShort === 'm' ? 1 : 2;
            logTerminal(`Target: ${detection.gender} (${Math.round(detection.genderProbability*100)}%)`);

            // Prediction logic
            let results = [];
            phenotypeList.forEach(group => {
                // Check Main
                let mainScore = cosSimilarity(group[0][gIdx], detection.descriptor) * 100;
                results.push({ name: group[0][0], score: mainScore });
                
                // Check Subs
                group[1].forEach(sub => {
                    let subScore = cosSimilarity(sub[gIdx], detection.descriptor) * 100;
                    results.push({ name: sub[0], score: subScore });
                });
            });

            results.sort((a, b) => b.score - a.score);

            logTerminal("<br>=== TOP PREDICTIONS ===", false, "#fff");
            results.slice(0, 5).forEach(r => {
                logTerminal(`${r.score.toFixed(2)}% | ${r.name}`);
            });

            logTerminal("<br>Generating structural morph...");
            await generateStructuralMix(results.slice(0, 3), genderShort);
            
            analyzeBtn.disabled = false;
        } catch (e) {
            logTerminal(`Runtime Error: ${e.message}`, true);
            analyzeBtn.disabled = false;
        }
    });

    // --- MORPHING ENGINE ---
    async function generateStructuralMix(predictions, gender) {
        const W = resultCanvas.width, H = resultCanvas.height;
        ctx.clearRect(0, 0, W, H);
        
        const subjects = [];
        const totalScore = predictions.reduce((sum, p) => sum + p.score, 0);

        for (let p of predictions) {
            const filename = `${p.name.toLowerCase().replace(/\s+/g, '')}${gender}.jpg`;
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = `../faces_lowres/${filename}`;
            
            try {
                await new Promise((res, rej) => { 
                    img.onload = res; 
                    img.onerror = () => rej(`Missing: ${filename}`); 
                });
                const det = await faceapi.detectSingleFace(img).withFaceLandmarks();
                if (det) {
                    subjects.push({ 
                        canvas: img, 
                        pts: addMetaPoints(det.landmarks.positions, W, H), 
                        weight: p.score / totalScore 
                    });
                }
            } catch (e) {
                logTerminal(`Skipped: ${p.name} (Image not found)`, true);
            }
        }

        if (subjects.length === 0) return logTerminal("Morphing failed: No images loaded.", true);

        const meanPts = subjects[0].pts.map((_, i) => {
            let x = 0, y = 0;
            subjects.forEach(s => { x += s.pts[i].x * s.weight; y += s.pts[i].y * s.weight; });
            return { x, y };
        });

        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = W; finalCanvas.height = H;
        const fCtx = finalCanvas.getContext('2d');
        const triangles = new Delaunator(meanPts.map(p => [p.x, p.y]).flat()).triangles;

        subjects.forEach((s) => {
            const tCanvas = document.createElement('canvas');
            tCanvas.width = W; tCanvas.height = H;
            const tCtx = tCanvas.getContext('2d');
            for (let i = 0; i < triangles.length; i += 3) {
                const tri = [triangles[i], triangles[i+1], triangles[i+2]];
                drawTriangle(tCtx, s.canvas, tri.map(j => s.pts[j]), tri.map(j => meanPts[j]));
            }
            fCtx.globalAlpha = s.weight;
            fCtx.drawImage(tCanvas, 0, 0);
        });

        ctx.drawImage(finalCanvas, 0, 0);
        logTerminal("Structural mix complete.");
    }

    function addMetaPoints(pts, w, h) {
        let p = pts.map(pt => ({ x: pt.x, y: pt.y }));
        p.push({x:0,y:0},{x:w,y:0},{x:0,y:h},{x:w,y:h},{x:w/2,y:0},{x:w/2,y:h},{x:0,y:h/2},{x:w,y:h/2});
        return p;
    }

    function drawTriangle(xc, img, src, dst) {
        const m = getAffine(src, dst); if (!m) return;
        xc.save(); xc.beginPath();
        xc.moveTo(dst[0].x, dst[0].y); xc.lineTo(dst[1].x, dst[1].y); xc.lineTo(dst[2].x, dst[2].y);
        xc.closePath(); xc.clip();
        xc.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
        xc.drawImage(img, 0, 0); xc.restore();
    }

    function getAffine(s, d) {
        const x0=s[0].x, y0=s[0].y, x1=s[1].x, y1=s[1].y, x2=s[2].x, y2=s[2].y;
        const u0=d[0].x, v0=d[0].y, u1=d[1].x, v1=d[1].y, u2=d[2].x, v2=d[2].y;
        const det = (x1-x0)*(y2-y0) - (x2-x0)*(y1-y0);
        if (Math.abs(det) < 0.1) return null;
        return [
            ((u1-u0)*(y2-y0)-(u2-u0)*(y1-y0))/det, ((v1-v0)*(y2-y0)-(v2-v0)*(y1-y0))/det,
            ((x1-x0)*(u2-u0)-(x2-x0)*(u1-u0))/det, ((x1-x0)*(v2-v0)-(x2-x0)*(v1-v0))/det,
            u0-(((u1-u0)*(y2-y0)-(u2-u0)*(y1-y0))/det)*x0-(((x1-x0)*(u2-u0)-(x2-x0)*(u1-u0))/det)*y0,
            v0-(((v1-v0)*(y2-y0)-(v2-v0)*(y1-y0))/det)*x0-(((x1-x0)*(v2-v0)-(x2-x0)*(v1-v0))/det)*y0
        ];
    }

    function logTerminal(text, isError = false, colorOverride = null) {
        const color = colorOverride || (isError ? '#ff4444' : '#00ff00');
        terminal.innerHTML += `<span style="color:${color};">> ${text}</span><br>`;
        terminal.scrollTop = terminal.scrollHeight;
    }

    window.onload = initSystem;
</script>

</body>
</html>
