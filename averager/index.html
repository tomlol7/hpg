<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Averager v1 | Mass Engine</title>
    
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>

    <style>
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .wrapper { max-width: 1000px; margin: 0 auto; background: #111; padding: 40px; border-radius: 24px; border: 1px solid #222; }
        h1 { color: #ffff00; text-transform: uppercase; letter-spacing: 3px; font-weight: 900; margin-bottom: 5px; }
        .subtitle { color: #555; font-size: 11px; margin-bottom: 30px; text-transform: uppercase; }
        
        .upload-area { 
            background: #1a1a1a; border: 2px dashed #333; padding: 30px; 
            border-radius: 16px; margin-bottom: 25px; transition: 0.3s;
        }
        .upload-area:hover { border-color: #ffff00; }
        
        #result-canvas { background: #000; border-radius: 12px; border: 1px solid #333; max-width: 100%; height: auto; margin-top: 20px; }

        button { 
            background: #ffff00; color: #000; border: none; padding: 18px 45px; 
            font-weight: 900; border-radius: 12px; cursor: pointer; transition: 0.2s;
            font-size: 15px; box-shadow: 0 4px 15px rgba(255, 255, 0, 0.2);
        }
        button:hover:not(:disabled) { transform: translateY(-2px); background: #fff; }
        button:disabled { background: #222; color: #444; cursor: not-allowed; }
        
        #status { font-family: 'Courier New', monospace; color: #00ff00; font-size: 12px; margin: 15px 0; min-height: 1.2em; }
        .file-count { color: #ffff00; font-weight: bold; }
    </style>
</head>
<body>
<a href="index.html" style="position: fixed; top: 20px; left: 20px; z-index: 9999; font-size: 20px; text-decoration: none; color: #fff; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 50px; border: 1px solid #555; backdrop-filter: blur(5px);">&#8592; Home</a>

<div class="wrapper">
    <h1>Mass Face Averager</h1>
    <div class="subtitle">v1</div>

    <div class="upload-area">
        <label style="cursor:pointer;">
            <div style="font-size: 14px; margin-bottom:10px;">Click to upload up to 20 images.</div>
            <input type="file" id="massUpload" accept="image/*" multiple>
        </label>
        <div id="fileInfo" style="margin-top:15px; font-size:12px; color:#888;">No files selected</div>
    </div>

    <button id="avgBtn" onclick="processAverage()" disabled>INITIALIZING AI...</button>
    <div id="status">Waiting for system boot...</div>

    <canvas id="result-canvas"></canvas>
    
    <div style="margin-top:25px;">
        <button id="saveBtn" style="background:#333; color:#eee; font-size:12px; padding:10px 20px;" onclick="saveResult()" disabled>DOWNLOAD AVERAGE</button>
    </div>
</div>

<script>
    const avgBtn = document.getElementById('avgBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('result-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let loadedImages = [];

    async function initSystem() {
        if (typeof faceapi === 'undefined' || typeof Delaunator === 'undefined') {
            setTimeout(initSystem, 300);
            return;
        }
        try {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            status.innerText = "Ready. Please upload facial subjects. Works better with front facing images.";
            avgBtn.innerText = "START MASS AVERAGING";
            avgBtn.disabled = false;
        } catch (err) {
            status.innerText = "Critical Error: Model load failed.";
        }
    }

    async function processAverage() {
        if (loadedImages.length === 0) return alert("Upload some images first!");
        
        avgBtn.disabled = true;
        const validSubjects = [];
        const W = 800, H = 1000; // Standardized HD Output size
        canvas.width = W; canvas.height = H;

        // Step 1: Face Detection & Normalization
        for (let i = 0; i < loadedImages.length; i++) {
            status.innerText = `Analyzing Subject ${i+1}/${loadedImages.length}...`;
            const img = await loadImage(loadedImages[i]);
            const det = await faceapi.detectSingleFace(img).withFaceLandmarks();
            
            if (det) {
                // Normalize eye position so all faces "sit" in the same spot
                const normData = getNormalization(det.landmarks, W, H);
                const normCanvas = applyNormalization(img, normData);
                // Re-detect on the "straightened" face for perfect landmarks
                const detN = await faceapi.detectSingleFace(normCanvas).withFaceLandmarks();
                if (detN) {
                    validSubjects.push({
                        canvas: normCanvas,
                        pts: addMetaPoints(detN.landmarks.positions, W, H)
                    });
                }
            } else {
                console.warn(`No face in image ${i}. Skipping.`);
            }
        }

        if (validSubjects.length === 0) {
            status.innerText = "Failed: No faces detected in any images.";
            avgBtn.disabled = false;
            return;
        }

        // Step 2: Calculate Mean Geometry
        status.innerText = `Calculating Mean Geometry for ${validSubjects.length} subjects...`;
        const meanPts = [];
        for (let p = 0; p < validSubjects[0].pts.length; p++) {
            let sumX = 0, sumY = 0;
            validSubjects.forEach(s => { sumX += s.pts[p].x; sumY += s.pts[p].y; });
            meanPts.push({ x: sumX / validSubjects.length, y: sumY / validSubjects.length });
        }

        // Step 3: Warp & Layer
        status.innerText = "Synthesizing final phenotype...";
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = W; finalCanvas.height = H;
        const fCtx = finalCanvas.getContext('2d');
        
        const triangles = new Delaunator(meanPts.map(p => [p.x, p.y]).flat()).triangles;

        validSubjects.forEach((subject, idx) => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = W; tempCanvas.height = H;
            const tCtx = tempCanvas.getContext('2d');

            for (let i = 0; i < triangles.length; i += 3) {
                const tr = [triangles[i], triangles[i+1], triangles[i+2]];
                drawSeamlessTriangle(tCtx, subject.canvas, tr.map(j => subject.pts[j]), tr.map(j => meanPts[j]));
            }

            // Standard Averaging: Each face contributes equally
            fCtx.globalAlpha = 1 / (idx + 1); 
            fCtx.drawImage(tempCanvas, 0, 0);
        });

        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(finalCanvas, 0, 0);
        
        status.innerHTML = `Success! Averaged <span class="file-count">${validSubjects.length}</span> phenotypes.`;
        avgBtn.disabled = false;
        document.getElementById('saveBtn').disabled = false;
    }

    // Helper: Load Image from File
    function loadImage(file) {
        return new Promise((res) => {
            const img = new Image();
            img.onload = () => res(img);
            const fr = new FileReader();
            fr.onload = e => img.src = e.target.result;
            fr.readAsDataURL(file);
        });
    }

    function getNormalization(lm, tw, th) {
        const le = lm.getLeftEye(), re = lm.getRightEye();
        const lC = { x: (le[0].x + le[3].x)/2, y: (le[0].y + le[3].y)/2 };
        const rC = { x: (re[0].x + re[3].x)/2, y: (re[0].y + re[3].y)/2 };
        const dx = rC.x - lC.x, dy = rC.y - lC.y;
        return { angle: Math.atan2(dy, dx), scale: (tw * 0.28) / Math.sqrt(dx*dx + dy*dy), center: lC, tw, th };
    }

    function applyNormalization(img, n) {
        const c = document.createElement('canvas'); c.width = n.tw; c.height = n.th;
        const x = c.getContext('2d');
        x.translate(n.tw * 0.36, n.th * 0.42); 
        x.rotate(-n.angle);
        x.scale(n.scale, n.scale);
        x.drawImage(img, -n.center.x, -n.center.y);
        return c;
    }

    function addMetaPoints(pts, w, h) {
        let p = pts.map(pt => ({ x: pt.x, y: pt.y }));
        p.push({x:0,y:0}, {x:w,y:0}, {x:0,y:h}, {x:w,y:h}, {x:w/2,y:0}, {x:w/2,y:h}, {x:0,y:h/2}, {x:w,y:h/2});
        return p;
    }

    function drawSeamlessTriangle(xc, img, src, dst) {
        const m = getAffine(src, dst);
        if (!m) return;
        const cx = (dst[0].x + dst[1].x + dst[2].x) / 3;
        const cy = (dst[0].y + dst[1].y + dst[2].y) / 3;
        xc.save();
        xc.beginPath();
        dst.forEach((p, i) => {
            const dx = p.x - cx, dy = p.y - cy;
            const d = Math.sqrt(dx*dx + dy*dy);
            const ox = p.x + (dx/d) * 0.5;
            const oy = p.y + (dy/d) * 0.5;
            if (i === 0) xc.moveTo(ox, oy); else xc.lineTo(ox, oy);
        });
        xc.closePath();
        xc.clip();
        xc.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
        xc.drawImage(img, 0, 0);
        xc.restore();
    }

    function getAffine(s, d) {
        const x0=s[0].x, y0=s[0].y, x1=s[1].x, y1=s[1].y, x2=s[2].x, y2=s[2].y;
        const u0=d[0].x, v0=d[0].y, u1=d[1].x, v1=d[1].y, u2=d[2].x, v2=d[2].y;
        const det = (x1-x0)*(y2-y0) - (x2-x0)*(y1-y0);
        if (Math.abs(det) < 0.1) return null;
        const a = ((u1-u0)*(y2-y0) - (u2-u0)*(y1-y0)) / det;
        const b = ((v1-v0)*(y2-y0) - (v2-v0)*(y1-y0)) / det;
        const c = ((x1-x0)*(u2-u0) - (x2-x0)*(u1-u0)) / det;
        const _d = ((x1-x0)*(v2-v0) - (x2-x0)*(v1-v0)) / det;
        const e = u0 - a*x0 - c*y0;
        const f = v0 - b*x0 - _d*y0;
        return [a, b, c, _d, e, f];
    }

    function saveResult() {
        const l = document.createElement('a');
        l.download = 'averaged_result.png';
        l.href = canvas.toDataURL('image/png');
        l.click();
    }

    document.getElementById('massUpload').onchange = e => {
        loadedImages = Array.from(e.target.files).slice(0, 20);
        document.getElementById('fileInfo').innerHTML = `<span class="file-count">${loadedImages.length}</span> images loaded.`;
    };

    window.onload = initSystem;
</script>
</body>
</html>
