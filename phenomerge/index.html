<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phenotype Mixer Pro | Mobile v5.5 (Percentage Mod)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>

    <style>
        :root { --accent: #ffff00; --bg: #0a0a0a; --card: #151515; --text: #eee; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { padding: 15px; border-bottom: 1px solid #222; text-align: center; position: sticky; top: 0; background: var(--bg); z-index: 100; }
        header h1 { margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); }

        /* Mobile First Layout */
        .main-layout { display: flex; flex-direction: column; flex: 1; gap: 10px; padding: 10px; }
        
        /* Workspace at top for mobile visibility */
        .workspace { background: #0e0e0e; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; border: 1px solid #222; order: 1; }
        
        .merge-box { 
            width: 100%; box-sizing: border-box; min-height: 100px; 
            background: #111; border: 2px dashed #333; border-radius: 12px; 
            display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; margin-bottom: 15px;
        }

        /* --- PERCENTAGE MOD CSS --- */
        .merge-item {
            position: relative;
            display: inline-block;
            width: 50px; 
            height: 65px; 
        }
        .merge-item img {
            width: 50px; 
            height: 50px; 
            object-fit: cover; 
            border-radius: 6px; 
            border: 1px solid #444; 
            cursor: pointer;
        }
        .merge-item input {
            width: 100%;
            box-sizing: border-box;
            background: #000;
            color: var(--accent);
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 10px;
            text-align: center;
            margin-top: 2px;
        }
        .merge-item input::-webkit-outer-spin-button,
        .merge-item input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        /* -------------------------- */

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 15px; }
        button { 
            background: var(--accent); color: #000; border: none; padding: 15px; 
            font-weight: 800; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 11px;
        }
        button:disabled { background: #222; color: #555; }
        #clearBtn { background: #333; color: #fff; }
        #saveBtn { background: #fff; grid-column: span 2; }

        #result-canvas { background: #000; border-radius: 8px; border: 1px solid #333; width: 100%; height: auto; max-width: 400px; }
        #status { font-family: monospace; font-size: 10px; color: #00ff00; margin-bottom: 10px; text-align: center; }

        /* Sidebars become scrollable sections below */
        .sidebar { background: var(--card); border-radius: 12px; padding: 15px; order: 2; border: 1px solid #222; }
        .sidebar h2 { font-size: 11px; text-transform: uppercase; color: var(--accent); margin: 0 0 10px 0; }
        .search-input { width: 100%; box-sizing: border-box; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
        
        .scroll-box { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; 
            max-height: 300px; overflow-y: auto; padding-right: 5px;
        }
        .scroll-box img { width: 100%; aspect-ratio: 1; border-radius: 4px; object-fit: cover; border: 1px solid transparent; cursor: pointer; }

        /* Desktop Adjustments */
        @media (min-width: 900px) {
            body { height: 100vh; overflow: hidden; }
            .main-layout { display: grid; grid-template-columns: 300px 1fr 300px; overflow: hidden; height: calc(100vh - 60px); }
            .sidebar { order: unset; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
            .workspace { order: unset; height: 100%; overflow-y: auto; }
            .scroll-box { flex: 1; max-height: none; }
        }
    </style>
</head>
<body>

<header>
    <h1>Structural Phenotype Mixer <small style="font-size: 10px; opacity: 0.5;">v5.5 (Percentage Mod)</small></h1>
</header>

<div class="main-layout">
    <div class="workspace">
        <div id="status">Initializing Neural Networks...</div>
        <div class="merge-box" id="mergeBox">
            <div id="placeholder-text" style="color: #444; font-size: 12px; margin: auto;">TAP PHENOTYPES TO ADD</div>
        </div>

        <div class="controls">
            <button id="avgBtn" onclick="processAverage()" disabled>BOOTING AI...</button>
            <button id="clearBtn" onclick="clearBox()">CLEAR</button>
            <button id="saveBtn" onclick="saveResult()" disabled>SAVE HD RESULT</button>
        </div>

        <canvas id="result-canvas"></canvas>
    </div>

    <div class="sidebar">
        <h2>Male Phenotypes</h2>
        <input type="text" class="search-input" id="maleSearch" placeholder="Search male...">
        <div class="scroll-box" id="maleBox"></div>
    </div>

    <div class="sidebar">
        <h2>Female Phenotypes</h2>
        <input type="text" class="search-input" id="femaleSearch" placeholder="Search female...">
        <div class="scroll-box" id="femaleBox"></div>
    </div>
</div>

<script>
    const mergeBox = document.getElementById('mergeBox');
    const status = document.getElementById('status');
    const avgBtn = document.getElementById('avgBtn');
    const canvas = document.getElementById('result-canvas');
    const ctx = canvas.getContext('2d');

    async function initSystem() {
        if (typeof faceapi === 'undefined') { setTimeout(initSystem, 300); return; }
        try {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            
            const res = await fetch('list.json');
            const data = await res.json();
            populateBoxes(data);

            status.innerText = "Neural Engine Ready.";
            avgBtn.innerText = "GENERATE AVERAGE";
            avgBtn.disabled = false;
        } catch (err) {
            status.innerText = "Network Error: Check list.json";
        }
    }

    function populateBoxes(list) {
        const maleContainer = document.getElementById('maleBox');
        const femaleContainer = document.getElementById('femaleBox');
        
        list.forEach(item => {
            const filename = Array.isArray(item) ? item[0] : item;
            const gender = filename.slice(-1).toLowerCase();
            const img = document.createElement('img');
            img.src = `/faces_lowres/${filename.toLowerCase()}.jpg`;
            img.dataset.filename = filename;
            
            img.onclick = () => addToMerge(img.src);
            
            if (gender === 'm') maleContainer.appendChild(img);
            else femaleContainer.appendChild(img);
        });
    }

    function addToMerge(src) {
        document.getElementById('placeholder-text').style.display = 'none';
        if (mergeBox.querySelectorAll('.merge-item').length >= 20) return alert("Max 20 reached.");
        
        const div = document.createElement('div');
        div.className = 'merge-item';
        
        const img = document.createElement('img');
        img.src = src;
        
        const input = document.createElement('input');
        input.type = 'number';
        input.value = '50'; // Default placeholder weight
        input.placeholder = '%';

        // Click on image in box to remove it
        img.onclick = () => {
            div.remove();
            if(mergeBox.querySelectorAll('.merge-item').length === 0) {
                document.getElementById('placeholder-text').style.display = 'block';
            }
        };
        
        div.appendChild(img);
        div.appendChild(input);
        mergeBox.appendChild(div);
    }

    async function processAverage() {
        const itemsInBox = mergeBox.querySelectorAll('.merge-item');
        if (itemsInBox.length < 2) return alert("Add at least 2 subjects.");

        // 1. Calculate total weight to normalize percentages
        let totalWeight = 0;
        const inputData = [];
        itemsInBox.forEach(el => {
            const imgEl = el.querySelector('img');
            const val = parseFloat(el.querySelector('input').value) || 0;
            totalWeight += val;
            inputData.push({ src: imgEl.src, rawWeight: val });
        });

        if (totalWeight <= 0) return alert("Total percentage must be greater than 0.");

        avgBtn.disabled = true;
        status.innerText = "Analyzing Face Geometry...";
        
        const W = 600, H = 750;
        canvas.width = W; canvas.height = H;

        const subjects = [];
        for (let data of inputData) {
            if (data.rawWeight <= 0) continue; // Skip 0% items

            const tempImg = new Image();
            tempImg.src = data.src;
            await new Promise(r => tempImg.onload = r);
            
            const det = await faceapi.detectSingleFace(tempImg).withFaceLandmarks();
            if (det) {
                const norm = getNormalization(det.landmarks, W, H);
                const normCanvas = applyNormalization(tempImg, norm);
                const detN = await faceapi.detectSingleFace(normCanvas).withFaceLandmarks();
                if (detN) {
                    const normalizedWeight = data.rawWeight / totalWeight; 
                    subjects.push({ 
                        canvas: normCanvas, 
                        pts: addMetaPoints(detN.landmarks.positions, W, H),
                        weight: normalizedWeight 
                    });
                }
            }
        }

        if (subjects.length === 0) {
            status.innerText = "No faces detected.";
            avgBtn.disabled = false;
            return;
        }

        // 2. Calculate weighted mean points
        const meanPts = subjects[0].pts.map((_, i) => {
            let x = 0, y = 0;
            subjects.forEach(s => { 
                x += s.pts[i].x * s.weight; 
                y += s.pts[i].y * s.weight; 
            });
            return { x, y };
        });

        status.innerText = `Synthesizing ${subjects.length} Subjects...`;
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = W; finalCanvas.height = H;
        const fCtx = finalCanvas.getContext('2d');
        
        // Pure black background needed for additive blending
        fCtx.fillStyle = '#000000';
        fCtx.fillRect(0, 0, W, H);
        fCtx.globalCompositeOperation = 'lighter';

        const triangles = new Delaunator(meanPts.map(p => [p.x, p.y]).flat()).triangles;

        subjects.forEach((s) => {
            const tCanvas = document.createElement('canvas');
            tCanvas.width = W; tCanvas.height = H;
            const tCtx = tCanvas.getContext('2d');
            for (let i = 0; i < triangles.length; i += 3) {
                const tri = [triangles[i], triangles[i+1], triangles[i+2]];
                drawSeamlessTriangle(tCtx, s.canvas, tri.map(j => s.pts[j]), tri.map(j => meanPts[j]));
            }
            
            // 3. Draw with exactly the weight percentage
            fCtx.globalAlpha = s.weight; 
            fCtx.drawImage(tCanvas, 0, 0);
        });

        // Reset the main canvas and draw the final result
        ctx.clearRect(0,0,W,H);
        ctx.globalCompositeOperation = 'source-over'; // Reset to default
        ctx.drawImage(finalCanvas, 0, 0);
        
        status.innerText = "Synthesis Successful.";
        avgBtn.disabled = false;
        document.getElementById('saveBtn').disabled = false;
        
        // Auto-scroll to result on mobile
        canvas.scrollIntoView({behavior: "smooth"});
    }

    // --- Core Warp Functions (Helper Logic) ---
    function getNormalization(lm, tw, th) {
        const le = lm.getLeftEye(), re = lm.getRightEye();
        const lC = { x: (le[0].x + le[3].x)/2, y: (le[0].y + le[3].y)/2 };
        const rC = { x: (re[0].x + re[3].x)/2, y: (re[0].y + re[3].y)/2 };
        const dx = rC.x - lC.x, dy = rC.y - lC.y;
        return { angle: Math.atan2(dy, dx), scale: (tw * 0.28) / Math.sqrt(dx*dx + dy*dy), center: lC, tw, th };
    }

    function applyNormalization(img, n) {
        const c = document.createElement('canvas'); c.width = n.tw; c.height = n.th;
        const x = c.getContext('2d');
        x.translate(n.tw * 0.36, n.th * 0.42); x.rotate(-n.angle); x.scale(n.scale, n.scale);
        x.drawImage(img, -n.center.x, -n.center.y);
        return c;
    }

    function addMetaPoints(pts, w, h) {
        let p = pts.map(pt => ({ x: pt.x, y: pt.y }));
        p.push({x:0,y:0}, {x:w,y:0}, {x:0,y:h}, {x:w,y:h}, {x:w/2,y:0}, {x:w/2,y:h}, {x:0,y:h/2}, {x:w,y:h/2});
        return p;
    }

    function drawSeamlessTriangle(xc, img, src, dst) {
        const m = getAffine(src, dst); if (!m) return;
        const cx = (dst[0].x + dst[1].x + dst[2].x) / 3, cy = (dst[0].y + dst[1].y + dst[2].y) / 3;
        xc.save(); xc.beginPath();
        dst.forEach((p, i) => {
            const dx = p.x - cx, dy = p.y - cy, d = Math.sqrt(dx*dx + dy*dy);
            const ox = p.x + (dx/d) * 0.5, oy = p.y + (dy/d) * 0.5;
            if (i === 0) xc.moveTo(ox, oy); else xc.lineTo(ox, oy);
        });
        xc.closePath(); xc.clip();
        xc.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
        xc.drawImage(img, 0, 0); xc.restore();
    }

    function getAffine(s, d) {
        const x0=s[0].x, y0=s[0].y, x1=s[1].x, y1=s[1].y, x2=s[2].x, y2=s[2].y;
        const u0=d[0].x, v0=d[0].y, u1=d[1].x, v1=d[1].y, u2=d[2].x, v2=d[2].y;
        const det = (x1-x0)*(y2-y0) - (x2-x0)*(y1-y0);
        if (Math.abs(det) < 0.1) return null;
        return [
            ((u1-u0)*(y2-y0) - (u2-u0)*(y1-y0)) / det,
            ((v1-v0)*(y2-y0) - (v2-v0)*(y1-y0)) / det,
            ((x1-x0)*(u2-u0) - (x2-x0)*(u1-u0)) / det,
            ((x1-x0)*(v2-v0) - (x2-x0)*(v1-v0)) / det,
            u0 - (((u1-u0)*(y2-y0) - (u2-u0)*(y1-y0)) / det)*x0 - (((x1-x0)*(u2-u0) - (x2-x0)*(u1-u0)) / det)*y0,
            v0 - (((v1-v0)*(y2-y0) - (v2-v0)*(y1-y0)) / det)*x0 - (((x1-x0)*(v2-v0) - (x2-x0)*(v1-v0)) / det)*y0
        ];
    }

    function clearBox() {
        mergeBox.innerHTML = '<div id="placeholder-text" style="color: #444; font-size: 12px; margin: auto;">TAP PHENOTYPES TO ADD</div>';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('saveBtn').disabled = true;
    }

    function saveResult() {
        const l = document.createElement('a');
        l.download = `phenotype_mix.png`;
        l.href = canvas.toDataURL();
        l.click();
    }

    document.getElementById('maleSearch').oninput = e => filterList('maleBox', e.target.value);
    document.getElementById('femaleSearch').oninput = e => filterList('femaleBox', e.target.value);

    function filterList(boxId, query) {
        const imgs = document.getElementById(boxId).querySelectorAll('img');
        imgs.forEach(img => img.style.display = img.dataset.filename.toLowerCase().includes(query.toLowerCase()) ? 'block' : 'none');
    }

    window.onload = initSystem;
</script>
</body>
</html>
