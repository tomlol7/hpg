<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phenotype Mixer + Scroll Boxes</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  h2, h3 { margin-bottom: 0.5rem; }
  .scroll-box, #phenomergeBox {
    display: flex; overflow-x: auto; border: 1px solid #ccc; padding: 1rem; margin-bottom: 2rem;
    min-height: 120px; align-items: center;
  }
  .phenotype {
    margin: 0 0.5rem; text-align: center; cursor: grab;
  }
  .phenotype img {
    width: 80px; height: 80px; object-fit: cover; border-radius: 50%; display: block; margin-bottom: 0.3rem;
  }
  #averageBtn { padding: 0.5rem 1rem; font-size: 1rem; }
</style>
</head>
<body>

<h2>Phenotype Mixer</h2>

<h3>Male Phenotypes</h3>
<div id="maleBox" class="scroll-box"></div>

<h3>Female Phenotypes</h3>
<div id="femaleBox" class="scroll-box"></div>

<h3>Drag phenotypes here (max 50, one gender per mix)</h3>
<div id="phenomergeBox"></div>

<button id="averageBtn">Average Face</button>
<div id="resultContainer"></div>

<script>
// Recursive filename extraction from list.json
function getFilename(entry) {
  if (typeof entry === 'string') return entry.toLowerCase();
  if (Array.isArray(entry)) {
    for (let i = 0; i < entry.length; i++) {
      const name = getFilename(entry[i]);
      if (name) return name;
    }
  }
  return null;
}

// Populate a scroll box
function populateScrollBox(box, filenames) {
  box.innerHTML = '';
  filenames.forEach(name => {
    const div = document.createElement('div');
    div.classList.add('phenotype');
    div.setAttribute('draggable', true);
    div.setAttribute('data-name', name);
    div.innerHTML = `<img src="/faces_lowres/${name}.jpg" alt="${name}"><p>${name}</p>`;
    box.appendChild(div);

    // Make draggable
    div.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', name);
    });
  });
}

// Drag & drop for phenomerge box
function enableDragAndDrop() {
  const phenomergeBox = document.getElementById('phenomergeBox');
  phenomergeBox.addEventListener('dragover', e => e.preventDefault());
  phenomergeBox.addEventListener('drop', e => {
    e.preventDefault();
    const name = e.dataTransfer.getData('text/plain');
    const existing = Array.from(phenomergeBox.children).map(c => c.dataset.name);

    // Max 50 items
    if (existing.length >= 50) { alert('Max 50 phenotypes'); return; }

    // Only one gender per mix
    if (existing.some(n => n.slice(-1) === name.slice(-1))) {
      alert('Only one gender per mix'); return;
    }

    const div = document.createElement('div');
    div.classList.add('phenotype');
    div.dataset.name = name;
    div.innerHTML = `<img src="/faces_lowres/${name}.jpg" alt="${name}"><p>${name}</p>`;
    phenomergeBox.appendChild(div);
  });
}

// Initialize
(async () => {
  try {
    const response = await fetch('/list.json');
    const list = await response.json();

    const baseNames = list.map(f => getFilename(f)).filter(Boolean);

    const malePhenotypes = baseNames.filter(name => name.slice(-1) === 'm');
    const femalePhenotypes = baseNames.filter(name => name.slice(-1) === 'f');

    console.log('Male phenotypes:', malePhenotypes);
    console.log('Female phenotypes:', femalePhenotypes);

    populateScrollBox(document.getElementById('maleBox'), malePhenotypes);
    populateScrollBox(document.getElementById('femaleBox'), femalePhenotypes);

    enableDragAndDrop();

  } catch (err) {
    console.error('Error loading list.json:', err);
  }
})();

// Average button placeholder (hook your AI averaging here)
document.getElementById('averageBtn').addEventListener('click', () => {
  const phenomergeBox = document.getElementById('phenomergeBox');
  const selected = Array.from(phenomergeBox.children).map(c => c.dataset.name);
  if (!selected.length) return alert('Add at least one phenotype to average');
  document.getElementById('resultContainer').innerHTML = `
    <p>Would generate average face for: ${selected.join(', ')}</p>
  `;
});
</script>

</body>
</html>
