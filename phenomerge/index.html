<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phenotype Mixer</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 0; }
  h1 { margin: 1rem 0; }
  .container { display: flex; gap: 1rem; width: 90%; max-width: 1200px; }
  .scroll-box { width: 200px; height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 0.5rem; }
  .scroll-box img { width: 100%; margin-bottom: 0.5rem; cursor: grab; }
  #mergeBox { width: 400px; height: 400px; border: 2px dashed #666; display: flex; flex-wrap: wrap; gap: 0.25rem; padding: 0.25rem; }
  #mergeBox img { width: 80px; height: 80px; object-fit: cover; }
  #averageBtn, #clearBtn { margin: 1rem; padding: 0.5rem 1rem; font-size: 1rem; }
  canvas { border: 1px solid #000; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Phenotype Mixer</h1>
<div class="container">
  <div>
    <h2>Male Phenotypes</h2>
    <input type="text" id="maleSearch" placeholder="Search male..." />
    <div class="scroll-box" id="maleBox"></div>
  </div>
  <div>
    <h2>Phenomerge Box</h2>
    <div id="mergeBox"></div>
    <button id="averageBtn">Average Face</button>
    <button id="clearBtn">Clear Merge Box</button>
  </div>
  <div>
    <h2>Female Phenotypes</h2>
    <input type="text" id="femaleSearch" placeholder="Search female..." />
    <div class="scroll-box" id="femaleBox"></div>
  </div>
</div>
<canvas id="resultCanvas" width="400" height="400"></canvas>

<script>
let list = [];
let mergeGender = null;
const MAX_MERGE = 50;

const maleBox = document.getElementById('maleBox');
const femaleBox = document.getElementById('femaleBox');
const mergeBox = document.getElementById('mergeBox');
const resultCanvas = document.getElementById('resultCanvas');
const ctx = resultCanvas.getContext('2d');

// Flatten nested arrays to get filenames safely
function getFilename(entry) {
  if (typeof entry === 'string') return entry;
  if (Array.isArray(entry)) return getFilename(entry[0]);
  return null;
}

// Fetch list.json from parent folder
fetch('../list.json')
  .then(res => res.json())
  .then(data => {
    list = data;

    const filenames = list.map(f => getFilename(f)).filter(Boolean);

    const malePhenotypes = filenames.filter(name => name.slice(-1).toLowerCase() === 'm');
    const femalePhenotypes = filenames.filter(name => name.slice(-1).toLowerCase() === 'f');

    populateScrollBox(maleBox, malePhenotypes);
    populateScrollBox(femaleBox, femalePhenotypes);
  });

// Populate scroll boxes
function populateScrollBox(container, arr) {
  container.innerHTML = '';
  arr.forEach(filename => {
    const img = document.createElement('img');
    img.src = `../faces_lowres/${filename}.jpg`;
    img.alt = filename;
    img.draggable = true;
    img.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', filename);
    });
    container.appendChild(img);
  });
}

// Drag & Drop
mergeBox.addEventListener('dragover', e => e.preventDefault());
mergeBox.addEventListener('drop', e => {
  e.preventDefault();
  const filename = e.dataTransfer.getData('text/plain');
  if (!filename) return;

  const genderChar = filename.slice(-1).toLowerCase();
  if (!mergeGender) mergeGender = genderChar;
  if (mergeGender !== genderChar) {
    alert('You can only merge one gender at a time.');
    return;
  }

  if (mergeBox.children.length >= MAX_MERGE) {
    alert(`Maximum ${MAX_MERGE} faces allowed.`);
    return;
  }

  const img = document.createElement('img');
  img.src = `../faces_lowres/${filename}.jpg`;
  img.alt = filename;
  mergeBox.appendChild(img);
});

// Search filtering
document.getElementById('maleSearch').addEventListener('input', e => {
  const query = e.target.value.toLowerCase();
  Array.from(maleBox.children).forEach(img => {
    img.style.display = img.alt.toLowerCase().includes(query) ? 'block' : 'none';
  });
});
document.getElementById('femaleSearch').addEventListener('input', e => {
  const query = e.target.value.toLowerCase();
  Array.from(femaleBox.children).forEach(img => {
    img.style.display = img.alt.toLowerCase().includes(query) ? 'block' : 'none';
  });
});

// Clear merge box button
document.getElementById('clearBtn').addEventListener('click', () => {
  mergeBox.innerHTML = '';
  mergeGender = null;
  ctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
});

// Average Face Button
document.getElementById('averageBtn').addEventListener('click', async () => {
  if (!mergeBox.children.length) return alert('Add some phenotypes first.');

  const imgs = Array.from(mergeBox.children).map(img => {
    const image = new Image();
    image.src = img.src;
    return image;
  });

  await Promise.all(imgs.map(img => new Promise(res => { img.onload = res; })));

  ctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);

  const w = resultCanvas.width;
  const h = resultCanvas.height;
  const imageDataArr = imgs.map(img => {
    ctx.drawImage(img, 0, 0, w, h);
    return ctx.getImageData(0, 0, w, h);
  });

  const output = ctx.createImageData(w, h);
  for (let i = 0; i < output.data.length; i += 4) {
    let r=0, g=0, b=0, a=0;
    imageDataArr.forEach(data => {
      r += data.data[i];
      g += data.data[i+1];
      b += data.data[i+2];
      a += data.data[i+3];
    });
    const n = imageDataArr.length;
    output.data[i] = r/n;
    output.data[i+1] = g/n;
    output.data[i+2] = b/n;
    output.data[i+3] = a/n;
  }

  ctx.putImageData(output, 0, 0);
});
</script>
</body>
</html>
